<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BlochCraft Quest — 何を起こしたい？</title>
  <link rel="stylesheet" href="src/quest.css">
</head>
<body>
  <main class="quest-shell">
    <header>
      <p id="quest-number" class="eyebrow">BlochCraft Quest</p>
      <h1 id="quest-title"></h1>
      <p id="quest-lead" class="lead"></p>
    </header>

    <section class="mission-card">
      <div class="mission-visual" aria-label="AとBが同じ結果を共有する">
        <span id="orb-a" class="orb orb-a">A</span><span class="link">• • •</span><span id="orb-b" class="orb orb-b">B</span>
      </div>
      <div class="conditions">
        <div id="condition-0"><span>○</span><p><strong></strong><small></small></p></div>
        <div id="condition-1"><span>○</span><p><strong></strong><small></small></p></div>
        <div id="condition-2"><span>○</span><p><strong></strong><small></small></p></div>
      </div>
    </section>

    <section id="feedback" class="feedback waiting">
      <p class="status-label">LABとつながっていません</p>
      <h2>BlochCraft Labで試してみよう。</h2>
      <p id="feedback-text">答えの回路は表示しません。回路を変えるたび、ここに現象の変化が返ってきます。</p>
    </section>

    <div class="actions">
      <button id="open-lab">実験用ウィンドウに戻る</button>
      <button id="hint" class="secondary">小さなヒント</button>
    </div>
    <p id="hint-text" class="hint" hidden></p>
  </main>
  <script type="module" src="src/quest.js"></script>
</body>
</html>
